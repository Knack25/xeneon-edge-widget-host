name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies without the Electron binary
        run: npm ci --ignore-scripts
      - name: Run Node tests
        run: npm test
      - name: Check hardware smoke scripts parse
        run: |
          node --check scripts/run-smoke.js
          node --check tests/electron-smoke.js
